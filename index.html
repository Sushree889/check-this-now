  <!-- Tailwind CSS -->

  <style>
    /* =========================================================================
       CORE VARIABLES & RESET
       ========================================================================= */
    :root {
      --font-display: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --spicy-bg: #070406;
      --spicy-burgundy: #3b0814;
      --spicy-crimson: #c9184a;
      --spicy-hot: #ff1e56;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: var(--font-sans);
      background-color: var(--spicy-bg);
      color: #ffffff;
      scroll-behavior: smooth;
    }

    .font-display {
      font-family: var(--font-display);
    }

    /* Responsive Fluid Typography */
    .heading-spicy {
      font-size: clamp(1.7rem, 5.2vw, 3.05rem);
      line-height: 1.22;
    }

    .subheading-spicy {
      font-size: clamp(1.05rem, 3vw, 1.4rem);
      line-height: 1.5;
    }

    .heading-reveal {
      font-size: clamp(1.55rem, 4.8vw, 2.65rem);
      line-height: 1.22;
    }

    .letter-text {
      font-size: clamp(0.97rem, 2.5vw, 1.07rem);
      line-height: 1.82;
    }

    /* =========================================================================
       THEME 1: MYSTERIOUS & SPICY BACKDROP (#070406, #3b0814, #c9184a)
       ========================================================================= */
    .theme-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      transition: opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bg-spicy {
      background:
        radial-gradient(circle at 50% 34%, rgba(201, 24, 74, 0.25) 0%, rgba(59, 8, 20, 0.88) 46%, #070406 96%),
        linear-gradient(180deg, #070406 0%, #1c0309 55%, #070406 100%);
      opacity: 1;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 46%, rgba(0, 0, 0, 0.8) 100%);
      transition: opacity 1.1s ease;
    }

    body.romantic-mode .vignette-overlay {
      background: radial-gradient(circle at center, transparent 56%, rgba(44, 5, 17, 0.45) 100%);
    }

    /* =========================================================================
       THEME 2: ROMANTIC & DREAMY BACKDROP (BURGUNDY, WINE RED, BLUSH & ROSE)
       ========================================================================= */
    .bg-romantic {
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 182, 193, 0.38) 0%, transparent 45%),
        radial-gradient(circle at 84% 20%, rgba(255, 117, 143, 0.34) 0%, transparent 48%),
        radial-gradient(circle at 50% 88%, rgba(253, 224, 71, 0.16) 0%, transparent 52%),
        linear-gradient(145deg, #3b0814 0%, #7f122f 44%, #9e193d 72%, #2b040e 100%);
      opacity: 0;
    }

    body.romantic-mode .bg-spicy {
      opacity: 0;
    }

    body.romantic-mode .bg-romantic {
      opacity: 1;
    }

    /* Warm Romantic Bokeh Lights */
    .bokeh-orb {
      position: fixed;
      border-radius: 9999px;
      filter: blur(48px);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.4s ease;
    }

    body.romantic-mode .bokeh-orb {
      opacity: 0.56;
    }

    @keyframes floatBokeh {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(18px, -22px, 0) scale(1.08); }
    }

    .animate-bokeh-1 {
      width: 230px;
      height: 230px;
      top: 6%;
      left: -45px;
      background: rgba(255, 143, 163, 0.5);
      animation: floatBokeh 9s ease-in-out infinite;
    }

    .animate-bokeh-2 {
      width: 270px;
      height: 270px;
      bottom: 8%;
      right: -55px;
      background: rgba(255, 204, 213, 0.42);
      animation: floatBokeh 11s ease-in-out infinite reverse;
    }

    .animate-bokeh-3 {
      width: 200px;
      height: 200px;
      top: 48%;
      left: 66%;
      background: rgba(255, 30, 86, 0.36);
      animation: floatBokeh 13s ease-in-out infinite;
    }

    /* =========================================================================
       PARTICLE CANVAS (60FPS AMBIENT & EXPLOSION EFFECTS)
       ========================================================================= */
    #particleCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* =========================================================================
       GLASSMORPHIC CARDS & GLOWING BUTTONS
       ========================================================================= */
    .spicy-card {
      background: rgba(18, 4, 9, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(201, 24, 74, 0.45);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        0 0 42px rgba(201, 24, 74, 0.3);
    }

    .romantic-card {
      max-width: 680px;
      background: linear-gradient(165deg, rgba(68, 9, 26, 0.86) 0%, rgba(39, 5, 16, 0.92) 100%);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1.5px solid rgba(255, 194, 209, 0.48);
      box-shadow:
        0 30px 75px rgba(20, 2, 8, 0.78),
        0 0 52px rgba(255, 117, 143, 0.34),
        inset 0 1px 0 rgba(255, 228, 234, 0.26);
    }

    /* Glowing Crimson/Pink Button */
    @keyframes pulseGlowSpicy {
      0%, 100% {
        box-shadow: 0 0 18px rgba(255, 30, 86, 0.55), 0 0 38px rgba(201, 24, 74, 0.45);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 28px rgba(255, 77, 121, 0.9), 0 0 56px rgba(201, 24, 74, 0.72);
        transform: scale(1.025);
      }
    }

    .btn-spicy {
      background: linear-gradient(135deg, #800f2f 0%, #c9184a 48%, #ff1e56 100%);
      border: 1.5px solid rgba(255, 182, 193, 0.75);
      color: #ffffff;
      animation: pulseGlowSpicy 2.3s infinite ease-in-out;
      transition: transform 0.22s ease, filter 0.22s ease;
    }

    .btn-spicy:hover {
      filter: brightness(1.1);
      transform: translateY(-2px) scale(1.03);
    }

    .btn-spicy:active {
      transform: scale(0.97);
    }

    /* Glowing Romantic WhatsApp Button */
    @keyframes pulseGlowWhatsApp {
      0%, 100% {
        box-shadow:
          0 0 20px rgba(255, 117, 143, 0.58),
          0 0 34px rgba(16, 185, 129, 0.4),
          0 10px 26px rgba(20, 4, 10, 0.6);
      }
      50% {
        box-shadow:
          0 0 32px rgba(255, 179, 193, 0.88),
          0 0 46px rgba(52, 211, 153, 0.62),
          0 14px 34px rgba(20, 4, 10, 0.65);
      }
    }

    .btn-whatsapp-romantic {
      background: linear-gradient(135deg, #be123c 0%, #e11d48 48%, #059669 100%);
      border: 1.5px solid rgba(255, 240, 243, 0.88);
      color: #ffffff;
      animation: pulseGlowWhatsApp 2.5s infinite ease-in-out;
      transition: transform 0.22s ease, filter 0.22s ease;
    }

    .btn-whatsapp-romantic:hover {
      filter: brightness(1.08);
      transform: translateY(-2px) scale(1.025);
    }

    .btn-whatsapp-romantic:active {
      transform: scale(0.97);
    }

    /* =========================================================================
       STAGE TRANSITIONS & INTERACTIVE KEYFRAMES
       ========================================================================= */
    .stage-section {
      display: none;
      opacity: 0;
      transform: translateY(18px) scale(0.985);
      transition: opacity 0.58s cubic-bezier(0.22, 1, 0.36, 1), transform 0.58s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stage-section.active {
      display: flex;
    }

    .stage-section.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Wrong Password Shake */
    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      18% { transform: translateX(-10px); }
      36% { transform: translateX(10px); }
      54% { transform: translateX(-7px); }
      72% { transform: translateX(7px); }
      90% { transform: translateX(-3px); }
    }

    .animate-shake {
      animation: errorShake 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Mystery Box Idle Floating */
    @keyframes floatBox1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-1.6deg); }
    }

    @keyframes floatBox2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1.6deg); }
    }

    .mystery-box-1 {
      animation: floatBox1 3.3s ease-in-out infinite;
    }

    .mystery-box-2 {
      animation: floatBox2 3.7s ease-in-out infinite;
    }

    .mystery-box-card {
      background: linear-gradient(160deg, rgba(59, 8, 20, 0.9) 0%, rgba(15, 4, 8, 0.95) 100%);
      border: 1.5px solid rgba(201, 24, 74, 0.55);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.82),
        0 0 30px rgba(201, 24, 74, 0.36),
        inset 0 1px 0 rgba(255, 204, 213, 0.16);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease, opacity 0.4s ease;
    }

    .mystery-box-card:hover {
      border-color: rgba(255, 143, 163, 0.94);
      box-shadow:
        0 24px 55px rgba(0, 0, 0, 0.88),
        0 0 46px rgba(255, 30, 86, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    /* Intense Selected Box Shake */
    @keyframes intenseBoxShake {
      0% { transform: translate(0, 0) rotate(0deg) scale(1.06); }
      10% { transform: translate(-8px, -4px) rotate(-5deg) scale(1.08); }
      20% { transform: translate(8px, 3px) rotate(5deg) scale(1.08); }
      30% { transform: translate(-10px, 2px) rotate(-6deg) scale(1.1); }
      40% { transform: translate(10px, -3px) rotate(6deg) scale(1.1); }
      50% { transform: translate(-8px, 4px) rotate(-4deg) scale(1.12); }
      60% { transform: translate(8px, -2px) rotate(4deg) scale(1.12); }
      70% { transform: translate(-11px, -3px) rotate(-7deg) scale(1.14); }
      80% { transform: translate(11px, 3px) rotate(7deg) scale(1.14); }
      90% { transform: translate(-6px, 2px) rotate(-3deg) scale(1.15); }
      100% { transform: translate(0, 0) rotate(0deg) scale(1.16); }
    }

    .box-shaking {
      animation: intenseBoxShake 0.4s linear infinite !important;
      border-color: #ff1e56 !important;
      box-shadow: 0 0 60px rgba(255, 30, 86, 0.92) !important;
    }

    /* Cartoon Bomb Pulse & Fuse Spark */
    @keyframes bombThrob {
      0%, 100% { transform: scale(1) rotate(-2deg); }
      50% { transform: scale(1.09) rotate(2deg); }
    }

    .bomb-animate {
      animation: bombThrob 0.32s ease-in-out infinite;
    }

    @keyframes sparkFlicker {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(25deg); opacity: 0.85; }
    }

    .fuse-spark {
      transform-origin: center;
      animation: sparkFlicker 0.12s infinite alternate;
    }

    /* Explosion Flash, Shockwave Rings & Smoke Clouds */
    #explosionOverlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #blastFlash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #ffffff 0%, #ffe5ec 42%, #ff758f 76%, #be123c 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 65;
      transition: opacity 0.12s ease-out;
    }

    @keyframes shockwaveExpand {
      0% {
        width: 24px;
        height: 24px;
        opacity: 0.96;
        border-width: 8px;
      }
      100% {
        width: 150vmax;
        height: 150vmax;
        opacity: 0;
        border-width: 1px;
      }
    }

    .shockwave-ring {
      position: absolute;
      border-radius: 9999px;
      border-style: solid;
      border-color: rgba(255, 228, 234, 0.95);
      box-shadow: 0 0 42px rgba(255, 117, 143, 0.9);
      animation: shockwaveExpand 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes smokeBillow {
      0% {
        transform: translate(0, 0) scale(0.35);
        opacity: 0.88;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(2.4);
        opacity: 0;
      }
    }

    .smoke-cloud {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 228, 234, 0.74) 0%, rgba(190, 18, 60, 0.36) 55%, transparent 75%);
      filter: blur(18px);
      animation: smokeBillow 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes viewportImpact {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-12px, 9px); }
      30% { transform: translate(11px, -10px); }
      45% { transform: translate(-9px, -7px); }
      60% { transform: translate(8px, 8px); }
      75% { transform: translate(-5px, 4px); }
    }

    .impact-shake {
      animation: viewportImpact 0.55s ease-out;
    }

    /* =========================================================================
       ROMANTIC PHOTO FRAME, BLOOMING ROSES & LETTER STYLING
       ========================================================================= */
    @keyframes frameHalo {
      0%, 100% {
        box-shadow:
          0 0 26px rgba(255, 143, 163, 0.55),
          0 0 58px rgba(201, 24, 74, 0.4),
          inset 0 0 18px rgba(255, 228, 234, 0.32);
      }
      50% {
        box-shadow:
          0 0 42px rgba(255, 179, 193, 0.85),
          0 0 80px rgba(255, 77, 109, 0.52),
          inset 0 0 26px rgba(255, 240, 243, 0.48);
      }
    }

    .photo-frame-glow {
      animation: frameHalo 3.5s ease-in-out infinite;
    }

    .photo-natural {
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    @keyframes roseBloomFloat {
      0%, 100% { transform: translateY(0) rotate(-6deg) scale(1); }
      50% { transform: translateY(-7px) rotate(6deg) scale(1.12); }
    }

    .rose-bloom {
      animation: roseBloomFloat 3.2s ease-in-out infinite;
    }

    @keyframes gentleFloatHeart {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.12); }
    }

    .floating-badge-heart {
      animation: gentleFloatHeart 2.8s ease-in-out infinite;
    }

    /* Staggered Letter Paragraph Reveal */
    .letter-paragraph {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }

    .letter-paragraph.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* Custom Scrollbar for Letter Container */
    .letter-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .letter-scroll::-webkit-scrollbar-track {
      background: rgba(255, 204, 213, 0.08);
      border-radius: 9999px;
    }
    .letter-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 143, 163, 0.45);
      border-radius: 9999px;
    }
    .letter-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 179, 193, 0.68);
    }
  </style>
</head>
